[Heltec_lora32_v2]
extends = esp32_base
board = heltec_wifi_lora_32_V2
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_v2
  -D HELTEC_LORA_V2
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D P_LORA_DIO_1=26
  -D P_LORA_NSS=18
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=RADIOLIB_NC
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=27
  -D P_LORA_TX_LED=25
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=15
  -D PIN_USER_BTN=0
  -D PIN_OLED_RESET=16
  -D ARDUINO_LOOP_STACK_SIZE=16384
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v2>
lib_deps =
  ${esp32_base.lib_deps}

[env:Heltec_v2_meshlog]
extends = Heltec_lora32_v2
build_flags =
  ${Heltec_lora32_v2.build_flags}
  -D MAX_GROUP_CHANNELS=8
  -D MAX_CONTACTS=300
  ; -D WEBSERVER_ENABLE=1
  ; -D WEBSERVER_OTA_ENABLE=1
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<meshlog>
lib_deps =
  ${Heltec_lora32_v2.lib_deps}
  ${esp32_ota.lib_deps}
