name: Provenance-checked development firmware

on:
  pull_request:
  push:
    branches: [dev, berksmesh]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLATFORMIO_CORE_VERSION: 6.1.18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO Core
        run: python -m pip install --disable-pip-version-check "platformio==$PLATFORMIO_CORE_VERSION"
      - name: Test packaging behavior
        run: python -m unittest discover -s tests -v
      - name: Set candidate identity and source timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=1.5.0-dev.${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build all checked board environments
        run: |
          set -euxo pipefail
          for environment in \
            Generic_E22_meshlog \
            Heltec_v2_meshlog \
            Heltec_lora32_v3_meshlog \
            Heltec_wireless_stick_lite_v3_meshlog \
            Heltec_v4_meshlog \
            LilyGo_T3S3_meshlog \
            LilyGo_TLora_v2_1_meshlog \
            Xiao_S3_meshlog
          do
            pio run --environment "$environment" --target mergebin
          done
      - name: Package unvalidated build outputs
        run: |
          python scripts/package_release.py \
            --version "$BUILD_VERSION" \
            --commit "$GITHUB_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload development artifacts (not a release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNVALIDATED-meshlog-berks-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    # Other tags need their own reviewed, per-checksum validation record.
    if: ${{ github.ref == 'refs/tags/v1.5.0-berks.5' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Test packaging behavior
        run: python -m unittest discover -s tests -v
      - name: Package byte-identical owner-approved release outputs
        run: |
          python -m scripts.package_approved_release --output dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Verify release bytes match owner-approved candidate
        run: python -m scripts.verify_release_approval --approval docs/owner-validation-wsl-hf.json --manifest dist/manifest.json
      - name: Publish validated GitHub release
        run: |
          cat > release-notes.md <<EOF
          BerksMesh MeshLog 1.5.0-berks.5: eight board-specific merged images, including Heltec Wireless Stick Lite V3 HTIT-WSL-HF (863–928 MHz variant, not LF). This adds WSL HF to the preceding v1.5.0-berks.4 seven-board release; the RV3028 dependency is pinned to upstream commit f15f5c1130a53a7d63f6977d23539a0f0ce1cc6d.

          Project owner Andrew attested that all eight exact candidate images were validated and authorized publication. Detailed per-board tester identities, hardware revisions, test dates and test-step records were not supplied; this is an owner attestation, not independently documented hardware testing. CI compiled eight targets and passed unit/packaging tests, but compilation is not physical testing.

          Published images are the exact owner-approved bytes from candidate source commit e7a7db2facb89f60b7537bf0476a97eda13e11d2 (upstream base 9c012f67ae20316eca97f6748e4331191702059b). Packaging and approval are tracked in tag ${GITHUB_SHA}. The manifest records the candidate image provenance and model/filename/checksum for each board; SHA256SUMS verifies all assets. The tag includes docs/owner-validation-wsl-hf.json with the approved image hashes. A path-dependent ELF digest means a fresh CI rebuild is not byte-identical and is not substituted for the approved images.

          Radio profile: 869.618 MHz, 62.5 kHz bandwidth, SF8, coding rate 4/8. Use only where this profile and transmit power comply with local radio rules.

          Verify the downloaded merged image against SHA256SUMS; select the exact board model and flash at offset 0x0. An erase/merged-image flash removes configuration and identity. Preserve any required identity via an already secured backup first. For rollback on the seven previously released boards, reflash their matching v1.5.0-berks.4 images and restore your own backed-up settings/identity as needed; WSL HF has no earlier tagged release. No browser flasher is included.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BerksMesh MeshLog ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md