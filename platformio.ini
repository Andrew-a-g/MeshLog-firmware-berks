; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	variants/*/platformio.ini

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
  SPI
  Wire
  jgromes/RadioLib @ 7.7.1
  rweather/Crypto @ 0.4.0
  adafruit/RTClib @ 2.1.3
  adafruit/Adafruit BusIO @ 1.17.4
  melopero/Melopero RV3028 @ 1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ 1.4.0
  bblanchon/ArduinoJson @ 7.4.1
  https://github.com/meshcore-dev/MeshCore.git#07a3ca9e05b0ab23b878200b2c44b04e08131972
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D ENABLE_ADVERT_ON_BOOT=1
  ; Import supports deliberate recovery/migration. Export is intentionally not
  ; compiled into release-matrix environments because it exposes identity keys.
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  ; Reduce time-derived variation. This alone does not guarantee reproducibility.
  ; GCC also honours SOURCE_DATE_EPOCH for __DATE__/__TIME__ in version.h.
  -D BUILD_TIME_EPOCH=0
extra_scripts = pre:scripts/record_build_provenance.py
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/radiolib/*.cpp>

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts =
  ${arduino_base.extra_scripts}
  merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  ESP32Async/AsyncTCP @ 3.5.0
  file://arch/esp32/AsyncElegantOTA

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
